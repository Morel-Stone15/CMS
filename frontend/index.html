<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme -->
    <meta name="theme-color" content="#00d4ff" />
    <meta name="background-color" content="#060b17" />

    <!-- SEO -->
    <meta name="description" content="C-TECH — Plateforme officielle de gestion des membres du Club Technologique Étudiant." />
    <meta name="application-name" content="C-TECH" />

    <!-- iOS / Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="C-TECH" />
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png" />

    <!-- Windows Tile (Microsoft) -->
    <meta name="msapplication-TileColor" content="#060b17" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icons/icon-96x96.png" />

    <title>C-TECH — Portail Membre</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      /* Splash screen while app loads */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #060b17;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; transition: opacity 0.5s ease;
      }
      #splash img { width: 80px; height: 80px; object-fit: contain; filter: drop-shadow(0 0 20px #00d4ff); animation: pulse 2s ease-in-out infinite; }
      #splash .title { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 900; letter-spacing: 5px; color: #00d4ff; }
      #splash .subtitle { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 3px; color: #475569; text-transform: uppercase; }
      @keyframes pulse { 0%,100% { filter: drop-shadow(0 0 10px #00d4ff); } 50% { filter: drop-shadow(0 0 30px #00d4ff); } }
    </style>
  </head>
  <body>
    <!-- Splash screen -->
    <div id="splash">
      <img src="/logo.png" alt="C-TECH Logo" />
      <div class="title">C-TECH</div>
      <div class="subtitle">Club Technologique Étudiant</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register PWA service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
      // Hide splash once app is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) { splash.style.opacity = '0'; setTimeout(() => splash.remove(), 500); }
        }, 800);
      });
    </script>
  </body>
</html>
