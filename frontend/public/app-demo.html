<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-TECH — Portail Membres &amp; Administration</title>
<meta name="description" content="Plateforme de gestion du Club Etudiant C-TECH — espace membre et bureau.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#080d18;--bg-secondary:#0b1121;--bg-card:rgba(11,18,36,0.82);--bg-card-hover:rgba(16,26,52,0.9);--bg-glass:rgba(255,255,255,0.03);--bg-glass-hover:rgba(255,255,255,0.06);--bg-input:rgba(255,255,255,0.05);
  --accent-primary:#6366f1;--accent-primary-light:#818cf8;--accent-secondary:#8b5cf6;--accent-emerald:#10b981;--accent-warning:#f59e0b;--accent-danger:#ef4444;--accent-cyan:#06b6d4;
  --gradient-primary:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);--gradient-subtle:linear-gradient(135deg,rgba(99,102,241,0.12) 0%,rgba(139,92,246,0.08) 100%);--gradient-card:linear-gradient(135deg,rgba(99,102,241,0.06) 0%,rgba(139,92,246,0.04) 100%);
  --text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--text-accent:#818cf8;
  --border-primary:rgba(99,102,241,0.22);--border-subtle:rgba(255,255,255,0.07);--border-glass:rgba(255,255,255,0.10);--border-focus:rgba(99,102,241,0.6);
  --shadow-glow:0 0 40px rgba(99,102,241,0.15);--shadow-card:0 8px 32px rgba(0,0,0,0.45);--shadow-button:0 4px 16px rgba(99,102,241,0.3);
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-xl:18px;--radius-full:9999px;
  --font-main:'Inter','Segoe UI',sans-serif;--font-mono:'JetBrains Mono','Fira Code',monospace;
  --transition-fast:120ms cubic-bezier(0.4,0,0.2,1);--transition-normal:220ms cubic-bezier(0.4,0,0.2,1);
  --sidebar-width:256px;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-main);background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;top:-20%;left:-10%;width:55vw;height:55vw;background:radial-gradient(circle,rgba(99,102,241,0.05) 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-20%;right:-10%;width:45vw;height:45vw;background:radial-gradient(circle,rgba(139,92,246,0.05) 0%,transparent 70%);pointer-events:none;z-index:0}
#root{position:relative;z-index:1;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg-secondary)}::-webkit-scrollbar-thumb{background:rgba(99,102,241,0.25);border-radius:var(--radius-full)}::-webkit-scrollbar-thumb:hover{background:rgba(99,102,241,0.45)}
.app-shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-width);background:rgba(8,14,30,0.95);border-right:1px solid rgba(255,255,255,0.07);backdrop-filter:blur(20px) saturate(180%);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;box-shadow:1px 0 0 rgba(255,255,255,0.04),4px 0 24px rgba(0,0,0,0.4);transition:transform 220ms ease}
.sidebar-logo{padding:24px 20px 18px;border-bottom:1px solid var(--border-subtle)}
.logo-text{font-size:20px;font-weight:700;background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.3px}
.logo-sub{font-size:10px;color:var(--text-muted);margin-top:2px;letter-spacing:0.8px;text-transform:uppercase;font-weight:600}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.nav-section-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text-muted);text-transform:uppercase;padding:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-md);cursor:pointer;color:var(--text-secondary);font-size:13.5px;font-weight:500;transition:all var(--transition-fast);border:1px solid transparent;margin-bottom:1px;user-select:none}
.nav-item:hover{background:var(--bg-glass-hover);color:var(--text-primary);border-color:var(--border-subtle)}
.nav-item.active{background:rgba(99,102,241,0.12);color:var(--accent-primary-light);border-color:rgba(99,102,241,0.18)}
.sidebar-footer{padding:16px;border-top:1px solid var(--border-subtle)}
.main-content{flex:1;margin-left:var(--sidebar-width);min-height:100vh;display:flex;flex-direction:column}
.page-header{padding:28px 32px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-title{font-size:28px;font-weight:700;color:var(--text-primary);letter-spacing:-0.5px}
.page-subtitle{font-size:14px;color:var(--text-secondary);margin-top:4px}
.page-body{flex:1;padding:24px 32px 32px}
.card{background:rgba(11,18,36,0.75);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-xl);backdrop-filter:blur(16px) saturate(160%);box-shadow:0 4px 24px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.06);transition:all var(--transition-normal)}
.card:hover{border-color:rgba(99,102,241,0.22);box-shadow:0 8px 32px rgba(0,0,0,0.5),0 0 0 1px rgba(99,102,241,0.1)}
.card-header{padding:20px 24px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-size:16px;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:8px}
.card-body{padding:24px}
.card-gradient{background:var(--gradient-card);border-color:var(--border-primary)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.stat-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:20px;transition:all var(--transition-normal);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gradient-primary);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.stat-card:hover{border-color:var(--border-primary);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.stat-icon{width:40px;height:40px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;margin-bottom:12px;background:rgba(99,102,241,0.1);color:var(--accent-primary-light);font-size:20px}
.stat-value{font-size:28px;font-weight:700;color:var(--text-primary);line-height:1;margin-bottom:5px}
.stat-label{font-size:13px;color:var(--text-secondary);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--radius-md);font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all var(--transition-fast);white-space:nowrap;font-family:var(--font-main);text-decoration:none}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary{background:var(--gradient-primary);color:white;box-shadow:var(--shadow-button)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,0.4)}
.btn-secondary{background:var(--bg-glass-hover);color:var(--text-primary);border:1px solid var(--border-subtle)}
.btn-secondary:hover:not(:disabled){background:rgba(255,255,255,0.12);border-color:var(--border-primary)}
.btn-danger{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3)}
.btn-danger:hover:not(:disabled){background:rgba(239,68,68,0.25)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-lg{padding:14px 28px;font-size:16px}
.w-full{width:100%;justify-content:center}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.form-label{font-size:13px;font-weight:600;color:var(--text-secondary);letter-spacing:0.3px}
.form-input,.form-select,.form-textarea{background:var(--bg-input);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:11px 14px;font-size:14px;color:var(--text-primary);font-family:var(--font-main);width:100%;transition:all var(--transition-fast);outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--border-focus);background:rgba(99,102,241,0.05);box-shadow:0 0 0 3px rgba(99,102,241,0.08)}
.form-input::placeholder{color:var(--text-muted)}
.form-textarea{resize:vertical;min-height:100px}
.form-select option{background:#0d1632;color:var(--text-primary)}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.table-wrapper{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border-subtle)}
table{width:100%;border-collapse:collapse;background:var(--bg-card)}
thead tr{background:rgba(99,102,241,0.04);border-bottom:1px solid var(--border-subtle)}
th{padding:11px 16px;text-align:left;font-size:11px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--text-muted);white-space:nowrap}
td{padding:14px 16px;font-size:14px;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background var(--transition-fast)}
tbody tr:hover{background:var(--bg-glass-hover)}
.table-empty{padding:48px;text-align:center;color:var(--text-muted);font-size:14px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--radius-full);font-size:11px;font-weight:700;letter-spacing:0.4px}
.badge-primary{background:rgba(99,102,241,0.12);color:var(--accent-primary-light);border:1px solid rgba(99,102,241,0.22)}
.badge-success{background:rgba(16,185,129,0.12);color:#34d399;border:1px solid rgba(16,185,129,0.25)}
.badge-warning{background:rgba(245,158,11,0.12);color:#fbbf24;border:1px solid rgba(245,158,11,0.25)}
.badge-danger{background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.25)}
.badge-purple{background:rgba(124,58,237,0.12);color:#a78bfa;border:1px solid rgba(124,58,237,0.25)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--gradient-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:white;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.alert{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius-md);font-size:13px;font-weight:500}
.alert-purple{background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.25);color:#a78bfa}
.alert-success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);color:#34d399}
.alert-danger{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#f87171}
.alert-info{background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.25);color:#67e8f9}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:var(--radius-lg);font-size:14px;font-weight:500;min-width:280px;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,0.5);backdrop-filter:blur(16px);animation:slideIn 0.3s ease}
.toast.success{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:#34d399}
.toast.error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171}
.toast.info{background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);color:#818cf8}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:rgba(11,18,36,0.97);border:1px solid var(--border-glass);border-radius:var(--radius-xl);width:100%;max-width:520px;box-shadow:0 24px 64px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.05);animation:modalIn 0.25s ease;max-height:90vh;overflow:auto}
@keyframes modalIn{from{transform:scale(0.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{padding:24px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:18px;font-weight:700}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border-subtle);display:flex;justify-content:flex-end;gap:10px}
.auth-page-split{display:flex;min-height:100vh}
.auth-left-panel{width:480px;min-width:380px;padding:40px;display:flex;flex-direction:column;justify-content:center;gap:28px;position:relative;z-index:1}
.auth-right-panel{flex:1;position:relative;overflow:hidden}
.auth-logo{text-align:center}
.auth-logo-text{font-size:32px;font-weight:800;background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px}
.auth-logo-sub{font-size:12px;color:var(--text-muted);margin-top:4px;letter-spacing:1px;text-transform:uppercase}
.auth-card{background:rgba(11,18,36,0.85);border:1px solid var(--border-glass);border-radius:var(--radius-xl);padding:28px;backdrop-filter:blur(20px);box-shadow:0 8px 40px rgba(0,0,0,0.5)}
.auth-tabs-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:22px;background:rgba(255,255,255,0.04);border-radius:var(--radius-md);padding:4px}
.auth-tab{padding:8px 6px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;transition:all var(--transition-fast);display:flex;align-items:center;justify-content:center;gap:5px;font-family:var(--font-main)}
.auth-tab.active{background:rgba(99,102,241,0.18);color:var(--accent-primary-light);border:1px solid rgba(99,102,241,0.25)}
.auth-tab:hover:not(.active){background:rgba(255,255,255,0.06);color:var(--text-primary)}
.member-card-container{display:flex;justify-content:center;align-items:center;padding:48px 24px;perspective:1000px}
.member-card{width:400px;height:252px;background:linear-gradient(135deg,#050b18 0%,#0d1a3d 40%,#1a0a2e 100%);border-radius:20px;border:1px solid rgba(0,212,255,0.35);box-shadow:0 25px 70px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.05),inset 0 1px 0 rgba(255,255,255,0.09),0 0 100px rgba(0,212,255,0.12),0 0 40px rgba(124,58,237,0.08);position:relative;overflow:hidden;font-family:var(--font-main);transform-style:preserve-3d;cursor:none;user-select:none;will-change:transform;transition:transform 0.08s ease-out,box-shadow 0.08s ease-out}
@keyframes holoShimmer{0%{transform:translateX(-100%) skewX(-15deg);opacity:0}20%{opacity:0.6}80%{opacity:0.6}100%{transform:translateX(300%) skewX(-15deg);opacity:0}}
@keyframes holoGlow{0%,100%{opacity:0.5}50%{opacity:1}}
@keyframes particlePulse{0%,100%{opacity:0.3;transform:scale(1)}50%{opacity:1;transform:scale(1.8)}}
@keyframes numberGlow{0%,100%{text-shadow:0 0 6px rgba(0,212,255,0.4)}50%{text-shadow:0 0 18px rgba(0,212,255,0.9),0 0 30px rgba(0,212,255,0.4)}}
.member-card::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 0%,rgba(0,212,255,0.04) 20%,rgba(124,58,237,0.06) 35%,rgba(0,212,255,0.08) 50%,rgba(255,100,180,0.04) 65%,transparent 80%);background-size:300% 300%;border-radius:20px;pointer-events:none;z-index:2;animation:holoGlow 4s ease-in-out infinite}
.member-card::after{content:'';position:absolute;top:-10%;left:-60%;width:50%;height:120%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07) 40%,rgba(0,212,255,0.12) 50%,rgba(255,255,255,0.07) 60%,transparent);transform:skewX(-15deg);border-radius:4px;pointer-events:none;z-index:3;animation:holoShimmer 5s ease-in-out infinite 1s}
.card-glare{position:absolute;inset:0;border-radius:20px;pointer-events:none;z-index:4;opacity:0;transition:opacity 0.3s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,0.15) 0%,rgba(0,212,255,0.06) 30%,transparent 65%)}
.member-card:hover .card-glare{opacity:1}
.card-particles{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;border-radius:20px}
.card-particle{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(0,212,255,0.7);animation:particlePulse 2.5s ease-in-out infinite}
.card-particle:nth-child(1){top:15%;left:42%;animation-delay:0s;background:rgba(0,212,255,0.8)}
.card-particle:nth-child(2){top:72%;left:18%;animation-delay:0.6s;background:rgba(124,58,237,0.8)}
.card-particle:nth-child(3){top:35%;left:80%;animation-delay:1.2s;background:rgba(0,212,255,0.6)}
.card-particle:nth-child(4){top:85%;left:55%;animation-delay:0.3s;background:rgba(255,100,180,0.6)}
.card-particle:nth-child(5){top:55%;left:30%;animation-delay:1.8s;background:rgba(0,212,255,0.5)}
.card-particle:nth-child(6){top:20%;left:68%;animation-delay:2.1s;background:rgba(124,58,237,0.7)}
.card-chip{position:absolute;top:20px;left:20px;display:flex;flex-direction:column;gap:3px;z-index:5}
.card-chip-lines span{display:block;height:2.5px;width:26px;background:linear-gradient(90deg,rgba(0,212,255,0.9),rgba(124,58,237,0.7));border-radius:2px;box-shadow:0 0 6px rgba(0,212,255,0.4)}
.card-chip-lines span:nth-child(3){width:18px}
.card-logo-area{position:absolute;top:16px;right:20px;text-align:right;z-index:5}
.card-logo-text{font-weight:800;font-size:13px;letter-spacing:1.5px;color:#00d4ff;line-height:1}
.card-logo-sub{font-size:7.5px;color:#94a3b8;letter-spacing:0.5px}
.card-member-info{position:absolute;bottom:20px;left:20px;right:118px;z-index:5}
.card-member-name{font-size:19px;font-weight:700;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 20px rgba(255,255,255,0.2)}
.card-member-major{font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px}
.card-member-number{font-size:13px;font-weight:700;background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:8px;letter-spacing:1.5px;animation:numberGlow 3s ease-in-out infinite}
.card-member-level{display:inline-block;font-size:10px;background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3);border-radius:var(--radius-full);padding:2px 10px;color:var(--accent-primary);margin-top:5px;box-shadow:0 0 10px rgba(0,212,255,0.15)}
.card-qr-area{position:absolute;bottom:14px;right:14px;width:90px;height:90px;background:white;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,0.5),0 0 0 1.5px rgba(0,212,255,0.4),0 0 20px rgba(0,212,255,0.15);z-index:5}
.org-tree{display:flex;flex-direction:column;align-items:center;padding:24px;overflow-x:auto}
.org-node{background:var(--bg-card);border:1px solid var(--border-primary);border-radius:var(--radius-lg);padding:16px;min-width:160px;max-width:200px;text-align:center;position:relative;transition:all var(--transition-normal)}
.org-node:hover{background:var(--bg-card-hover);transform:translateY(-3px);box-shadow:var(--shadow-glow)}
.org-node.root{background:rgba(0,212,255,0.08);border-color:rgba(0,212,255,0.4)}
.org-node-role{font-size:12px;font-weight:700;color:var(--accent-primary-light);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.org-node-name{font-size:13px;font-weight:600;color:var(--text-primary)}
.org-node-empty{font-size:12px;color:var(--text-muted);font-style:italic}
.commission-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.commission-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);padding:20px;transition:all var(--transition-normal);cursor:pointer}
.commission-card:hover{border-color:var(--border-primary);transform:translateY(-2px);box-shadow:var(--shadow-glow)}
.chat-bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5}
.chat-bubble.other{background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.15);border-radius:4px 16px 16px 16px}
.chat-bubble.own{background:rgba(99,102,241,0.25);border:1px solid rgba(99,102,241,0.35);border-radius:16px 4px 16px 16px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}
.cal-header{font-size:11px;font-weight:600;color:var(--text-muted);text-align:center;padding:8px 0;text-transform:uppercase;letter-spacing:0.5px}
.cal-day{min-height:80px;padding:6px;border-radius:var(--radius-sm);background:var(--bg-glass);border:1px solid transparent;transition:all var(--transition-fast);cursor:pointer}
.cal-day:hover{background:var(--bg-glass-hover);border-color:var(--border-subtle)}

.cal-event{font-size:10px;background:rgba(99,102,241,0.2);border-radius:3px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-entry{padding:14px 20px;border-bottom:1px solid var(--border-subtle);display:flex;gap:12px;align-items:flex-start}
.log-entry:last-child{border-bottom:none}
.log-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-primary);flex-shrink:0;margin-top:5px}
.scanner-frame{width:100%;max-width:420px;margin:0 auto;border-radius:var(--radius-xl);overflow:hidden;border:2px solid var(--border-primary);box-shadow:var(--shadow-glow);background:#000;position:relative;aspect-ratio:4/3}
.scanner-overlay{position:absolute;inset:0;pointer-events:none;z-index:10}
.scanner-corner{position:absolute;width:30px;height:30px;border-color:var(--accent-primary);border-style:solid}
.scanner-corner.tl{top:20px;left:20px;border-width:3px 0 0 3px}
.scanner-corner.tr{top:20px;right:20px;border-width:3px 3px 0 0}
.scanner-corner.bl{bottom:20px;left:20px;border-width:0 0 3px 3px}
.scanner-corner.br{bottom:20px;right:20px;border-width:0 3px 3px 0}
@keyframes scanLine{0%{top:15%}100%{top:85%}}
.scanner-line{position:absolute;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--accent-primary),transparent);box-shadow:0 0 8px var(--accent-primary);animation:scanLine 2s ease-in-out infinite alternate}
.antigravity-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-2{gap:8px}.gap-3{gap:12px}.text-muted{color:var(--text-muted)}.hidden{display:none!important}
.fade-in{animation:fadeIn 0.3s ease}

@media(max-width:768px){

  .form-grid-2{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}

}

function handleMemberLogin(e){
  e.preventDefault();

  if(!m){showToast('Numero de membre introuvable.','error');return;}
  if(pin!=='123456'&&pin!=='000000'){showToast('Code PIN incorrect. Essayez 123456.','error');return;}
  currentUser=m;currentPage='card';showToast('Connexion reussie ! Bienvenue '+m.first_name,'success');setTimeout(render,500);
}
function handleBureauLogin(e){
  e.preventDefault();
  const num=document.getElementById('bnumber').value;const pin=document.getElementById('bpin').value;
  const m=members.find(x=>x.member_number===num&&x.is_bureau);
  if(!m){showToast('Identifiant bureau invalide.','error');return;}
  if(pin!=='123456'&&pin!=='000000'){showToast('Code PIN incorrect. Essayez 123456.','error');return;}
  currentUser=m;currentPage='dashboard';showToast('Connexion Bureau reussie !','success');setTimeout(render,500);

    <td style="font-size:13px">${m.major}</td>

function filterMembers(q){
  const filtered=members.filter(m=>!m.is_bureau).filter(m=>`${m.first_name} ${m.last_name} ${m.member_number} ${m.major}`.toLowerCase().includes(q.toLowerCase()));
  const el=document.getElementById('membersBody');if(el)el.innerHTML=memberRows(filtered);
}
function addMember(){
  const fn=document.getElementById('amFn').value.trim(),ln=document.getElementById('amLn').value.trim();

  const num='CT-2026-'+String(members.length).padStart(4,'0');
  members.push({id:members.length+1,member_number:num,first_name:fn,last_name:ln,major,level,email,phone,is_bureau:false,status:'actif',photo_path:null,created_at:new Date().toISOString(),private_notes:''});
  logs.unshift({id:logs.length+1,operator_name:`${currentUser.first_name} ${currentUser.last_name}`,action_description:`Ajout du membre ${fn} ${ln} (${num}).`,timestamp:new Date().toISOString()});

function deleteMember(id){

function doScan(){

function orgTreeHtml(){
  const roots=orgChart.filter(n=>!n.parent_id);
  function nodeHtml(n){
    const children=orgChart.filter(c=>c.parent_id===n.id);const isRoot=!n.parent_id;
    return `<div style="display:flex;flex-direction:column;align-items:center">
      <div class="org-node${isRoot?' root':''}" onclick="deleteOrgNode(${n.id})" title="Clic pour supprimer">
        ${n.member?`<div style="margin-bottom:8px">${av(n.member)}</div>`:''}
        <div class="org-node-role">${n.role_name}</div>
        <div class="${n.member?'org-node-name':'org-node-empty'}">${n.member?`${n.member.first_name} ${n.member.last_name}`:'Vacant'}</div>
      </div>
      ${children.length?`<div style="width:2px;height:24px;background:var(--border-primary)"></div><div style="display:flex;gap:16px;position:relative">
        ${children.length>1?`<div style="position:absolute;top:0;left:50%;transform:translateX(-50%);height:2px;width:calc(100% - 80px);background:var(--border-primary)"></div>`:''}
        ${children.map(ch=>`<div style="display:flex;flex-direction:column;align-items:center"><div style="width:2px;height:16px;background:var(--border-primary)"></div>${nodeHtml(ch)}</div>`).join('')}
      </div>`:''}
    </div>`;
  }
  return `<div class="org-tree">${roots.map(r=>nodeHtml(r)).join('')}</div>`;
}
function addOrgNode(){
  const role=document.getElementById('orgRole').value.trim();const mId=document.getElementById('orgMember').value;const pId=document.getElementById('orgParent').value;
  if(!role){showToast('Intitule requis.','error');return;}
  const m=mId?members.find(x=>x.id===parseInt(mId)):null;
  orgChart.push({id:orgChart.length+10,role_name:role,parent_id:pId?parseInt(pId):null,member:m?{first_name:m.first_name,last_name:m.last_name}:null});
  closeModal('addOrgModal');showToast(`Role "${role}" ajoute !`,'success');
  const el=document.getElementById('orgTreeWrap');if(el)el.innerHTML=orgTreeHtml();
}
function deleteOrgNode(id){
  if(!confirm('Supprimer ce role ?'))return;
  orgChart=orgChart.filter(n=>n.id!==id);showToast('Role supprime.','success');
  const el=document.getElementById('orgTreeWrap');if(el)el.innerHTML=orgTreeHtml();
}

function msgHtml(msg){
  const isOwn=msg.member_id===currentUser.id;const m=members.find(x=>x.id===msg.member_id);
  return `<div style="display:flex;gap:10px;max-width:75%;${isOwn?'align-self:flex-end;flex-direction:row-reverse':''}">

      ${!isOwn?`<div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">${msg.sender_name}</div>`:''}
      <div class="chat-bubble ${isOwn?'own':'other'}">${msg.message}</div>
      <div style="font-size:10px;color:var(--text-muted);margin-top:4px;text-align:${isOwn?'right':'left'}">${fmt(msg.sent_at)}</div>

}
function initChat(){const c=document.getElementById('chatMessages');if(c)c.scrollTop=c.scrollHeight;}
function sendMsg(){

  const newMsg={id:discussion.length+1,member_id:currentUser.id,sender_name:`${currentUser.first_name} ${currentUser.last_name}`,message:msg,sent_at:new Date().toISOString()};
  discussion.push(newMsg);inp.value='';
  const c=document.getElementById('chatMessages');if(c){c.innerHTML+=msgHtml(newMsg);c.scrollTop=c.scrollHeight;}
}
function sendMassEmail(){
  const subj=document.getElementById('emailSubject').value.trim(),body=document.getElementById('emailBody').value.trim();

  const n=members.filter(m=>!m.is_bureau&&m.status==='actif').length;
  showToast(`Email envoye a ${n} membres !`,'success');
  document.getElementById('emailSubject').value='';document.getElementById('emailBody').value='';
}

function renderCalGrid(){
  const months=['Janvier','Fevrier','Mars','Avril','Mai','Juin','Juillet','Aout','Septembre','Octobre','Novembre','Decembre'];
  const el=document.getElementById('calTitle');if(el)el.textContent=`${months[calMonth]} ${calYear}`;
  const first=new Date(calYear,calMonth,1).getDay();const startDay=(first+6)%7;
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();const prevDays=new Date(calYear,calMonth,0).getDate();
  const today=new Date();
  let html=`<div class="calendar-grid">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<div class="cal-header">${d}</div>`).join('')}`;
  for(let i=0;i<startDay;i++)html+=`<div class="cal-day other-month"><div style="font-size:13px;color:var(--text-muted)">${prevDays-startDay+i+1}</div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const isToday=today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===d;
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=calendarEvents.filter(e=>e.start_date===ds);
    html+=`<div class="cal-day${isToday?' today':''}"><div style="font-size:13px;font-weight:${isToday?800:600};color:${isToday?'var(--accent-primary-light)':'inherit'}">${d}</div>${evs.map(e=>`<div class="cal-event">${e.title}</div>`).join('')}</div>`;
  }
  const total=startDay+daysInMonth;const remaining=(total%7)===0?0:7-(total%7);
  for(let i=1;i<=remaining;i++)html+=`<div class="cal-day other-month"><div style="font-size:13px;color:var(--text-muted)">${i}</div></div>`;
  html+='</div>';
  const g=document.getElementById('calGrid');if(g)g.innerHTML=html;
}
function chgMonth(dir){calMonth+=dir;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}renderCalGrid();}
function addEvent(){

function initVCard(){
  const card=document.getElementById('virtualCard'),glare=document.getElementById('cardGlare');
  if(card){
    card.addEventListener('mousemove',e=>{
      const r=card.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      const dx=e.clientX-cx,dy=e.clientY-cy;
      const rotY=(dx/(r.width/2))*15,rotX=-(dy/(r.height/2))*15;
      card.style.transform=`rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.03)`;
      card.style.boxShadow=`${-rotY*1.5}px ${rotX*1.5}px 60px rgba(0,0,0,0.7),0 0 100px rgba(0,212,255,0.18)`;
      if(glare){const mx=((e.clientX-r.left)/r.width)*100,my=((e.clientY-r.top)/r.height)*100;glare.style.setProperty('--mx',`${mx}%`);glare.style.setProperty('--my',`${my}%`);}
    });
    card.addEventListener('mouseleave',()=>{card.style.transform='rotateX(0deg) rotateY(0deg) scale(1)';card.style.boxShadow='';});
  }
  const cv=document.getElementById('qrCanvas');
  if(cv){
    const ctx=cv.getContext('2d'),sz=82;
    ctx.fillStyle='white';ctx.fillRect(0,0,sz,sz);ctx.fillStyle='#000';
    const pat=genQR(currentUser.member_number),n=pat.length,cell=sz/n;
    pat.forEach((row,r)=>row.forEach((on,c)=>{if(on)ctx.fillRect(c*cell,r*cell,cell,cell);}));
  }
}
function genQR(data){
  const n=15;let grid=Array.from({length:n},()=>Array(n).fill(0));
  function finder(r,c){for(let i=0;i<7;i++)for(let j=0;j<7;j++)grid[r+i][c+j]=(i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4))?1:0;}
  finder(0,0);finder(0,n-7);finder(n-7,0);
  let hash=0;for(let ch of data)hash=(hash*31+ch.charCodeAt(0))&0xFFFFFF;
  for(let r=2;r<n-2;r++)for(let c=2;c<n-2;c++){if(r<8&&(c<8||c>n-9))continue;if(r>n-9&&c<8)continue;grid[r][c]=((hash>>((r*n+c)%24))&1);}
  return grid;
}

// ── CANVAS ────────────────────────────────────────────
function initCanvas(){
  const canvas=document.getElementById('antigravityCanvas');
  if(!canvas||!canvas.parentElement)return;
  const ctx=canvas.getContext('2d');let animId;
  let W=(canvas.width=canvas.parentElement.clientWidth),H=(canvas.height=canvas.parentElement.clientHeight);
  window.addEventListener('resize',()=>{W=canvas.width=canvas.parentElement.clientWidth;H=canvas.height=canvas.parentElement.clientHeight;});
  const mouse={x:W/2,y:H/2,tx:W/2,ty:H/2};
  const np=14,base=Math.min(W,H)*0.22;
  const points=Array.from({length:np},(_,i)=>({angle:(i/np)*Math.PI*2,phase:Math.random()*Math.PI*2,freq:1+Math.random()*1.5}));
  const particles=Array.from({length:30},()=>({x:Math.random()*W,y:Math.random()*H,size:Math.random()*2.5+1,sx:(Math.random()-0.5)*0.6,sy:(Math.random()-0.5)*0.6,alpha:Math.random()*0.6+0.2}));
  canvas.parentElement.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.tx=e.clientX-r.left;mouse.ty=e.clientY-r.top;});
  let t=0;
  function render(){
    t+=0.018;mouse.x+=(mouse.tx-mouse.x)*0.06;mouse.y+=(mouse.ty-mouse.y)*0.06;
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createRadialGradient(mouse.x,mouse.y,10,mouse.x,mouse.y,Math.max(W,H)*0.65);
    bg.addColorStop(0,'rgba(0,212,255,0.16)');bg.addColorStop(0.35,'rgba(124,58,237,0.12)');bg.addColorStop(0.7,'rgba(236,72,153,0.06)');bg.addColorStop(1,'transparent');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    particles.forEach(p=>{
      p.x+=p.sx;p.y+=p.sy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fillStyle=`rgba(0,212,255,${p.alpha})`;ctx.shadowBlur=8;ctx.shadowColor='#00d4ff';ctx.fill();ctx.shadowBlur=0;
    });
    const pts=points.map((p,i)=>{
      const d=Math.sin(t*p.freq+p.phase)*24+Math.cos(t*1.4+i*0.5)*16;
      const dx=mouse.x-W/2,dy=mouse.y-H/2;const md=Math.hypot(dx,dy),ma=Math.atan2(dy,dx);
      const ad=Math.cos(p.angle-ma);const r=base+d+ad*Math.min(md*0.2,50);
      return{x:mouse.x+Math.cos(p.angle)*r,y:mouse.y+Math.sin(p.angle)*r};
    });
    ctx.save();ctx.beginPath();
    const len=pts.length;ctx.moveTo((pts[0].x+pts[len-1].x)/2,(pts[0].y+pts[len-1].y)/2);
    for(let i=0;i<len;i++){const p1=pts[i],p2=pts[(i+1)%len];ctx.quadraticCurveTo(p1.x,p1.y,(p1.x+p2.x)/2,(p1.y+p2.y)/2);}
    ctx.closePath();
    const g=ctx.createLinearGradient(mouse.x-base,mouse.y-base,mouse.x+base,mouse.y+base);
    g.addColorStop(0,'rgba(0,212,255,0.8)');g.addColorStop(0.35,'rgba(59,130,246,0.75)');g.addColorStop(0.7,'rgba(124,58,237,0.75)');g.addColorStop(1,'rgba(236,72,153,0.7)');
    ctx.fillStyle=g;ctx.shadowBlur=45;ctx.shadowColor='rgba(0,212,255,0.65)';ctx.fill();
    ctx.lineWidth=2;const sg=ctx.createLinearGradient(mouse.x-base,mouse.y-base,mouse.x+base,mouse.y+base);
    sg.addColorStop(0,'rgba(255,255,255,0.85)');sg.addColorStop(0.5,'rgba(0,212,255,0.5)');sg.addColorStop(1,'rgba(236,72,153,0.7)');
    ctx.strokeStyle=sg;ctx.stroke();ctx.restore();
    animId=requestAnimationFrame(render);
  }
  render();
}
